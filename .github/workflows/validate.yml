name: Validate recipe

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Offline validation
        run: python tools/validate_recipe.py
      - name: Online validation (repositories reachable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/validate_recipe.py --online
