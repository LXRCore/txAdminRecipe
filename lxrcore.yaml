# ═══════════════════════════════════════════════════════════════════════════════
# 🐺 LXRCore Framework — txAdmin deployment recipe (v3)
# ═══════════════════════════════════════════════════════════════════════════════
#
#   Brand:       LXRCore — Lux Empire eXperience RedM Core
#   Product:     wolves.land / The Land of Wolves 🐺
#   Developer:   iBoss21 / LXRCore
#   Website:     https://www.lxrcore.com
#   Discord:     https://discord.gg/ZHMKVYyhBa (development)
#   GitHub:      https://github.com/LXRCore
#
#   Result of this recipe (clean server → playable):
#     server.cfg + icon           →  ./
#     database                    →  lxrcore.sql (core schema + official resource tables)
#     cfx-server-data             →  resources/[cfx-default]
#     oxmysql, pma-voice, forks   →  resources/[standalone]
#     lxr-core                    →  resources/[framework]/lxr-core
#     compatibility bridges       →  resources/[lxr-bridges]/{rsg-core,vorp_core,qbr-core,vorp_inventory}
#     official LXR resources      →  resources/[lxr]/…
#
#   Every task fails loudly; txAdmin stops the deployment on the first error.
#   Validate offline with:  python tools/validate_recipe.py
#
#   © 2026 iBoss21 / LXRCore | lxrcore.com | All Rights Reserved
# ═══════════════════════════════════════════════════════════════════════════════

$engine: 3
$onesync: on
$minFxVersion: 7290
$steamRequired: false
name: LXRCore Framework RedM
version: 3.0.0
author: iBoss21 / LXRCore
description: LXRCore v3 — RedM framework core with RSG / VORP / QBR compatibility adapters, official LXR resources and a migrated database.

tasks:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Base files
  # ─────────────────────────────────────────────────────────────────────────────
  - action: download_github
    src: https://github.com/LXRCore/txAdminRecipe
    ref: main
    dest: ./tmp/recipe

  - action: move_path
    src: ./tmp/recipe/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/recipe/myLogo.png
    dest: ./myLogo.png

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Database — core schema + tables owned by the official resources.
  #    lxr-core re-applies its own migrations at first boot (idempotent).
  # ─────────────────────────────────────────────────────────────────────────────
  - action: connect_database

  - action: query_database
    file: ./tmp/recipe/lxrcore.sql

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Cfx defaults and standalone dependencies
  # ─────────────────────────────────────────────────────────────────────────────
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: master
    subpath: resources
    dest: ./resources/[cfx-default]

  - action: download_file
    path: ./tmp/files/oxmysql.zip
    url: https://github.com/CommunityOx/oxmysql/releases/latest/download/oxmysql.zip

  - action: unzip
    src: ./tmp/files/oxmysql.zip
    dest: ./resources/[standalone]

  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: main
    dest: ./resources/[standalone]/pma-voice

  - action: download_github
    src: https://github.com/LXRCore/connectqueue
    ref: main
    dest: ./resources/[standalone]/connectqueue

  - action: download_github
    src: https://github.com/LXRCore/progressbar
    ref: main
    dest: ./resources/[standalone]/progressbar

  - action: download_github
    src: https://github.com/LXRCore/PolyZone
    ref: main
    dest: ./resources/[standalone]/PolyZone

  - action: download_github
    src: https://github.com/LXRCore/menuv
    ref: main
    dest: ./resources/[standalone]/menuv

  - action: download_github
    src: https://github.com/LXRCore/mediccamp
    ref: main
    dest: ./resources/[standalone]/mediccamp

  - action: download_github
    src: https://github.com/LXRCore/safecracker
    ref: main
    dest: ./resources/[standalone]/safecracker

  - action: waste_time # avoid GitHub throttling
    seconds: 8

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Framework core + compatibility bridges
  #    The bridges ship inside lxr-core/bridges and are moved into their own
  #    category so FXServer can see them. They are NOT ensured by default —
  #    enable the ones you need in server.cfg (only when the real resource is
  #    not installed).
  # ─────────────────────────────────────────────────────────────────────────────
  - action: download_github
    src: https://github.com/LXRCore/lxr-core
    ref: main
    dest: ./resources/[framework]/lxr-core

  - action: move_path
    src: ./resources/[framework]/lxr-core/bridges/rsg-core
    dest: ./resources/[lxr-bridges]/rsg-core

  - action: move_path
    src: ./resources/[framework]/lxr-core/bridges/vorp_core
    dest: ./resources/[lxr-bridges]/vorp_core

  - action: move_path
    src: ./resources/[framework]/lxr-core/bridges/qbr-core
    dest: ./resources/[lxr-bridges]/qbr-core

  - action: move_path
    src: ./resources/[framework]/lxr-core/bridges/vorp_inventory
    dest: ./resources/[lxr-bridges]/vorp_inventory

  - action: remove_path
    path: ./resources/[framework]/lxr-core/bridges

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Official LXR resources — dependency order first (core chain), then the rest
  # ─────────────────────────────────────────────────────────────────────────────
  - action: download_github
    src: https://github.com/LXRCore/lxr-nui
    ref: main
    dest: ./resources/[lxr]/lxr-nui

  - action: download_github
    src: https://github.com/LXRCore/lxr-inventory
    ref: main
    dest: ./resources/[lxr]/lxr-inventory

  - action: download_github
    src: https://github.com/LXRCore/lxr-creator
    ref: main
    dest: ./resources/[lxr]/lxr-creator

  - action: download_github
    src: https://github.com/LXRCore/lxr-barber
    ref: main
    dest: ./resources/[lxr]/lxr-barber

  - action: download_github
    src: https://github.com/LXRCore/lxr-spawn
    ref: main
    dest: ./resources/[lxr]/lxr-spawn

  - action: download_github
    src: https://github.com/LXRCore/lxr-clothing
    ref: main
    dest: ./resources/[lxr]/lxr-clothing

  - action: download_github
    src: https://github.com/LXRCore/lxr-hud
    ref: main
    dest: ./resources/[lxr]/lxr-hud

  - action: download_github
    src: https://github.com/LXRCore/lxr-interact
    ref: main
    dest: ./resources/[lxr]/lxr-interact

  - action: waste_time # avoid GitHub throttling
    seconds: 8

  - action: download_github
    src: https://github.com/LXRCore/lxr-admin
    ref: main
    dest: ./resources/[lxr]/lxr-admin

  - action: download_github
    src: https://github.com/LXRCore/lxr-bank
    ref: main
    dest: ./resources/[lxr]/lxr-bank

  - action: download_github
    src: https://github.com/LXRCore/lxr-business
    ref: main
    dest: ./resources/[lxr]/lxr-business

  - action: download_github
    src: https://github.com/LXRCore/lxr-lawman
    ref: main
    dest: ./resources/[lxr]/lxr-lawman

  - action: download_github
    src: https://github.com/LXRCore/lxr-doctor
    ref: main
    dest: ./resources/[lxr]/lxr-doctor

  - action: download_github
    src: https://github.com/LXRCore/lxr-weapons
    ref: main
    dest: ./resources/[lxr]/lxr-weapons

  - action: download_github
    src: https://github.com/LXRCore/lxr-shops
    ref: main
    dest: ./resources/[lxr]/lxr-shops

  - action: download_github
    src: https://github.com/LXRCore/lxr-horses
    ref: main
    dest: ./resources/[lxr]/lxr-horses

  - action: download_github
    src: https://github.com/LXRCore/lxr-trains
    ref: main
    dest: ./resources/[lxr]/lxr-trains

  - action: download_github
    src: https://github.com/LXRCore/lxr-me
    ref: main
    dest: ./resources/[lxr]/lxr-me

  - action: download_github
    src: https://github.com/LXRCore/lxr-mapcolor
    ref: main
    dest: ./resources/[standalone]/lxr-mapcolor

  - action: waste_time # avoid GitHub throttling
    seconds: 8

  - action: download_github
    src: https://github.com/LXRCore/lxr-doors
    ref: main
    dest: ./resources/[lxr]/lxr-doors

  - action: download_github
    src: https://github.com/LXRCore/lxr-lockpick
    ref: main
    dest: ./resources/[lxr]/lxr-lockpick

  - action: download_github
    src: https://github.com/LXRCore/lxr-interiors
    ref: main
    dest: ./resources/[lxr]/lxr-interiors

  - action: download_github
    src: https://github.com/LXRCore/lxr-census
    ref: main
    dest: ./resources/[lxr]/lxr-census

  - action: download_github
    src: https://github.com/LXRCore/lxr-frontier
    ref: main
    dest: ./resources/[lxr]/lxr-frontier

  - action: download_github
    src: https://github.com/LXRCore/lxr-weather
    ref: main
    dest: ./resources/[lxr]/lxr-weather

  - action: download_github
    src: https://github.com/LXRCore/lxr-mining
    ref: main
    dest: ./resources/[lxr]/lxr-mining

  - action: download_github
    src: https://github.com/LXRCore/lxr-farming
    ref: main
    dest: ./resources/[lxr]/lxr-farming

  - action: download_github
    src: https://github.com/LXRCore/lxr-hunting
    ref: main
    dest: ./resources/[lxr]/lxr-hunting

  - action: download_github
    src: https://github.com/LXRCore/lxr-warden
    ref: main
    dest: ./resources/[lxr]/lxr-warden

  - action: download_github
    src: https://github.com/LXRCore/lxr-lasso
    ref: main
    dest: ./resources/[lxr]/lxr-lasso

  - action: download_github
    src: https://github.com/LXRCore/lxr-blindfold
    ref: main
    dest: ./resources/[lxr]/lxr-blindfold

  - action: download_github
    src: https://github.com/LXRCore/lxr-contraband
    ref: main
    dest: ./resources/[lxr]/lxr-contraband

  - action: download_github
    src: https://github.com/LXRCore/lxr-moonshine
    ref: main
    dest: ./resources/[lxr]/lxr-moonshine

  - action: download_github
    src: https://github.com/LXRCore/lxr-love
    ref: main
    dest: ./resources/[lxr]/lxr-love

  - action: download_github
    src: https://github.com/LXRCore/lxr-storage
    ref: main
    dest: ./resources/[lxr]/lxr-storage

  - action: download_github
    src: https://github.com/LXRCore/lxr-dispatch
    ref: main
    dest: ./resources/[lxr]/lxr-dispatch

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Clean up
  # ─────────────────────────────────────────────────────────────────────────────
  - action: remove_path
    path: ./tmp
