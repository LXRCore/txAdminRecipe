################################################################################

#######################################
# 1) Network & Capacity
#######################################
{{serverEndpoints}}
sv_maxclients {{maxClients}}
sv_lan false
# Listing privacy: player identifiers are hidden from players.json on current artifacts.
# Indirect listing needs a hostname that resolves to this box — enable both together:
#sv_listingHostOverride "play.example.com"
#sv_forceIndirectListing true

#######################################
# 2) Game Build & Identity
#######################################
set gamename rdr3
set sv_enforceGameBuild 1491

#######################################
# 3) Keys
#######################################
sv_licenseKey "{{svLicense}}"
# Identity is the Rockstar license — a Steam Web API key is optional.
set steam_webApiKey "none"
set sv_enforceSteamAuth false

#######################################
# 4) Server Identity & Listing
#######################################
sv_hostname "{{serverName}}"
sets sv_projectName "{{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "lxrcore, redm, roleplay, serious rp"
sets locale "en-US"
sets Framework "LXRCore"
sets Website "https://www.lxrcore.com"
sets Discord "https://discord.gg/wolvesland"
sets Developer "iBoss21 / LXRCore"
load_server_icon myLogo.png
sets banner_detail "https://raw.githubusercontent.com/LXRCore/.github/main/profile/lxrcore-banner.png"
sets banner_connecting "https://raw.githubusercontent.com/LXRCore/.github/main/profile/lxrcore-banner.png"

#######################################
# 5) Locale & Branding read by the framework
#######################################
# lxr-core reads these into LXRCore.Brand — every NUI shows them
setr lxr_locale "en"
setr lxr_theme "night"
setr lxr_discord "https://discord.gg/wolvesland"
setr lxr_tagline "The Land of Wolves"

#######################################
# 6) Database (oxmysql)
#######################################
set mysql_connection_string "{{dbConnectionString}}"
set mysql_connection_limit 50
set mysql_acquire_timeout 30000
set mysql_idle_timeout 60000
set mysql_slow_query_warning 300
set mysql_debug false
set mysql_ui false

#######################################
# 7) OneSync & Performance
#######################################
# OneSync itself is switched on in the txAdmin settings page (the recipe sets it).
setr onesync_population true
setr onesync_distanceCull true
setr onesync_distanceCullVehicles true
setr onesync_workaround763185 true
set onesync_forceMigration 1
set onesync_workaround_blockingExports 1
set sv_experimentalNetGameEventHandler true
set sv_experimentalStateBagsHandler true
set sv_experimentalOnesyncPopulation true
# Extended-slot artifacts (feature/redm-physical-player-extension): the slot limit comes from
# the build, not from a convar. This flag is harmless on a stock artifact and kept for the
# feature build.
set onesync_physicalPlayerExtension true
setr lua_gc_multiplier 2
set sv_scriptMemoryLimit 4096

#######################################
# 8) Security & Rate Limiting
#######################################
set sv_scriptHookAllowed 0
set net_tcpConnLimit 64
set sv_filterRequestControl 4
set sv_requestParanoia 1
set sv_enableNetworkedPhoneExplosions false
set sv_enableNetworkedSounds false
set sv_authMaxVariance 2
set sv_authMinTrust 3
set rateLimiter_stateBag_rate 75
set rateLimiter_stateBag_burst 150
# lxr-core / lxr-warden add their own server-side checks on top of these.

#######################################
# 9) Resource Pools (RedM build 1491) — every value is the ceiling GSS publishes
#    (https://gss.cfx-services.net/v1/public/pool-size-limits/redm — the validator checks this file)
#######################################
increase_pool_size "CMoveObject" 100
increase_pool_size "FragmentStore" 4000
increase_pool_size "DrawableStore" 50000
increase_pool_size "CLightEntity" 2000
increase_pool_size "OcclusionInteriorInfo" 10
increase_pool_size "OcclusionPathNode" 1500
increase_pool_size "OcclusionPortalEntity" 140
increase_pool_size "OcclusionPortalInfo" 140
increase_pool_size "PortalInst" 150
increase_pool_size "ScaleformStore" 100
increase_pool_size "StaticBounds" 6500
increase_pool_size "TxdStore" 26000
increase_pool_size "InteriorProxy" 450
increase_pool_size "netGameEvent" 400
increase_pool_size "Object" 2000
increase_pool_size "AttachmentExtension" 430
increase_pool_size "CDoorExtension" 160
increase_pool_size "CPropSetObjectExtension" 950
increase_pool_size "CAvoidanceComponent" 1300
increase_pool_size "GrassBatch" 2000
increase_pool_size "CompEntity" 50
increase_pool_size "CNetObjDoor" 20
increase_pool_size "CDoorSyncData" 20
increase_pool_size "CNetObjPedBase" 110
increase_pool_size "NavMeshRoute" 200
increase_pool_size "CNetObjObject" 100
increase_pool_size "CCrimeObserver" 150
increase_pool_size "CNetObjVehicle" 40
increase_pool_size "CAnimalGroupMember" 110
increase_pool_size "CPedAvoidanceComponent" 256
increase_pool_size "CPedSyncData" 50
increase_pool_size "CAudioCollisionExtensionComponent" 1000
increase_pool_size "fwDynamicArchetypeComponent" 1200

#######################################
# 10) Event Bursts & Tick
#######################################
sv_eventBurstLimit 50
sv_eventBurstWindow 1000
net_maxFps 200

#######################################
# 11) Voice (pma-voice)
#######################################
setr voice_useSendingRangeOnly false
setr voice_use3dAudio true
setr voice_defaultVoiceMode 2
setr voice_enableUi 1

#######################################
# 12) Runtime & Logging
#######################################
set txAdmin-menuPtfxDisable true
set sv_logLevel 1
set sv_timeout 60000

#######################################
# 13) Cfx default resources
#######################################
ensure mapmanager
ensure spawnmanager
ensure sessionmanager-rdr3
ensure chat

#######################################
# 14) The framework — order matters
#######################################
ensure oxmysql
ensure lxr-core

## Compatibility bridges — enable ONLY when the real resource is NOT installed.
## They live in resources/[lxr-bridges]/ and forward to lxr-core.
#ensure rsg-core
#ensure vorp_core
#ensure qbr-core
#ensure vorp_inventory

## Official boot order — every manifest also declares its dependencies, so FXServer enforces
## this even when a line below is moved. See docs/BOOT-ORDER.md in the recipe.
ensure lxr-nui          # kit provider: toasts, menus, inputs, progress (core routes Notify here when started)
ensure lxr-mapcolor     # route / blip colours (others probe it at runtime)
ensure lxr-weather      # the calendar and the sky (GlobalState.hour — shops and banks read it)
ensure lxr-interact     # the interaction layer: points, zones, models, entities → one card
ensure lxr-inventory    # items, stashes, usable items
ensure lxr-clothing     # the appearance engine (tables, validator, apply layer)
ensure lxr-creator      # select + creation · loads @lxr-clothing shared files
ensure lxr-barber       # same engine dependency
ensure lxr-spawn        # listens for the creator's hand-off
ensure lxr-me           # /me overlay
ensure lxr-horses       # catalog + inventory items
ensure lxr-trains
ensure lxr-hud
ensure lxr-weapons      # weapon items → hands, calibre pools, gunsmith (needs core, nui, inventory · feeds the HUD)
ensure lxr-doors        # lock states, keys, lockpick hook (needs core, interact)
ensure lxr-lockpick     # the pick minigame lxr-doors calls
ensure lxr-shops        # counters from the catalog (needs core, nui, inventory, interact)
ensure lxr-bank         # branch books, wires, drafts, society books (needs core, nui, inventory, interact)
ensure lxr-dispatch     # calls to the trades on duty (needs core, nui · hears lxr-doors)
ensure lxr-lawman       # the law (needs core, nui, inventory, interact · uses weapons, bank, dispatch)
ensure lxr-doctor       # death, revives, beds (needs core, nui, inventory, interact · uses dispatch, weapons)
ensure lxr-business     # the proprietor ledger (needs core, nui, interact, bank)
ensure lxr-lasso        # rope on people (needs core, interact)
ensure lxr-blindfold    # the cloth over the eyes (needs core, interact · reads cuffed / tied)
ensure lxr-contraband   # running contracts to dead drops (needs core, interact · uses dispatch)
ensure lxr-farming      # seed, water, time (needs core, interact · reads the weather calendar)
ensure lxr-hunting      # skin what the game killed (needs core, interact · uses dispatch)
ensure lxr-mining       # veins and gravel bars (needs core, interact)
ensure lxr-moonshine    # the still in the woods (needs core, interact · uses dispatch)
ensure lxr-interiors    # entity sets and imaps (needs core)
ensure lxr-admin        # the staff desk (needs core · uses doctor, weather)
ensure lxr-census       # who is in town (needs core)
ensure lxr-warden       # server-side sanity (needs core · reads lxr-admin state bags)
ensure lxr-frontier     # the small things (needs core · uses interact)
ensure lxr-love         # paired interactions by consent (needs core, interact · adult set off by default)
ensure lxr-storage      # rented lock-ups (needs core, nui, inventory, interact)
ensure lxr-market       # the second-hand stalls (needs core, inventory, interact)
ensure lxr-craft        # recipes, trades, mastery (needs core, inventory, interact)
ensure lxr-post         # letters and telegrams (needs core, interact)
ensure lxr-safe         # the iron safe (needs core, nui, inventory, interact · uses lockpick, dispatch)
ensure lxr-camp         # a fire and what you carry (needs core, inventory, interact · uses lockpick, craft)
ensure [standalone]
ensure [lxr]

#######################################
# 15) Permissions
#######################################
## lxr-core creates the aces `lxrcore.<group>` for every group in Config.Server.permissions
## (god, developer, headadmin, admin, mod, helper, whitelisted). Assign players like this:
##   add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx lxrcore.admin

# allow the core resource to run commands it registers
add_ace resource.lxr-core command allow

# txAdmin master account (generated) gets full framework rights
add_principal group.admin lxrcore.god
{{addPrincipalsMaster}}

# inheritance: higher groups inherit the lower ones
add_principal lxrcore.god lxrcore.headadmin
add_principal lxrcore.headadmin lxrcore.admin
add_principal lxrcore.admin lxrcore.mod
add_principal lxrcore.mod lxrcore.helper
add_principal lxrcore.developer lxrcore.admin

# examples
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx lxrcore.god
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx lxrcore.admin
#add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx lxrcore.whitelisted
